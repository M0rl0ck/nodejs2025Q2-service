services:
  server:
    env_file: .env
    build:
      dockerfile: Dockerfile
      context: .
      target: production
    image: m0rl0ck/nodejs2025q2-server
    command: ['node', 'dist/main']
    ports:
      - ${PORT}:${PORT}
    environment:
      - NODE_ENV=production

    depends_on:
      - db
    networks:
      - internet
      - postgres-network

  db:
    env_file: .env
    build:
      context: ./db
    image: m0rl0ck/nodejs2025q2-db
    restart: always
    user: postgres
    volumes:
      - PG-DATA-PROD:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB={DB_NAME}
      - POSTGRES_HOST={DB_HOST}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_PORT=${DB_PORT}
    networks:
      - postgres-network

volumes:
  PG-DATA-PROD:

networks:
  internet:
    driver: bridge
    internal: true
  postgres-network:
    driver: bridge
